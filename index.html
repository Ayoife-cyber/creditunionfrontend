<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Experience modern banking with simplicity at its core. Manage your finances with powerful tools, secure transactions, and 24/7 support — all in one place." />
    <meta property="og:title" content="Shughar Credit Union" />
    <meta property="og:description" content="Experience modern banking with simplicity at its core. Manage your finances with powerful tools, secure transactions, and 24/7 support — all in one place." />
    <meta property="og:type" content="website" />
    <title>Shughar Credit Union</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: #0A1628;
        color: #E2E8F0;
      }

      #root {
        width: 100%;
        min-height: 100vh;
      }

      /* Loading Screen */
      .loading-container {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #0A1628;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        flex-direction: column;
        gap: 2rem;
      }

      .loading-container.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease-out;
      }

      .loader-logo {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        animation: pulse-loader 2s ease-in-out infinite;
      }

      .loader-logo svg {
        width: 36px;
        height: 36px;
        color: white;
      }

      @keyframes pulse-loader {
        0%, 100% {
          box-shadow: 0 0 30px rgba(239, 68, 68, 0.4), 0 0 0 0 rgba(239, 68, 68, 0.7);
        }
        50% {
          box-shadow: 0 0 40px rgba(239, 68, 68, 0.6), 0 0 10px 5px rgba(239, 68, 68, 0.2);
        }
      }

      .loader-text {
        font-family: 'Outfit', sans-serif;
        font-size: 18px;
        font-weight: 600;
        background: linear-gradient(135deg, #0369A1 0%, #06B6D4 50%, #10B981 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: fadeInUp 0.8s ease-out 0.3s backwards;
      }

      .loader-bar {
        width: 200px;
        height: 3px;
        background: rgba(6, 182, 212, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }

      .loader-bar-inner {
        height: 100%;
        background: linear-gradient(90deg, transparent, #0369A1, #06B6D4, #10B981, transparent);
        animation: loading-bar 2s ease-in-out infinite;
      }

      @keyframes loading-bar {
        0% {
          width: 0%;
          transform: translateX(-100%);
        }
        50% {
          width: 100%;
        }
        100% {
          width: 100%;
          transform: translateX(100%);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 font-body text-gray-900 min-h-screen">
    <!-- Loading Screen -->
    <div class="loading-container" id="loadingScreen">
      <div class="loader-logo">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Shield Background -->
          <path d="M60 10 L90 25 L90 55 C90 80 60 105 60 105 C60 105 30 80 30 55 L30 25 Z" fill="url(#shieldGradient)" opacity="0.95" />
          
          <!-- S Letter -->
          <g>
            <!-- Upper curve -->
            <path d="M 55 40 Q 45 35 45 45 Q 45 50 55 52 Q 65 54 65 62 Q 65 68 55 70" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Lower curve -->
            <path d="M 65 70 Q 65 78 55 80 Q 45 82 45 90 Q 45 100 60 103 Q 70 102 73 95" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </g>
          
          <!-- Gradients -->
          <defs>
            <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0369a1" />
              <stop offset="50%" stop-color="#06b6d4" />
              <stop offset="100%" stop-color="#10b981" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="loader-text">Loading Shughar</div>
      <div class="loader-bar">
        <div class="loader-bar-inner"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener('load', () => {
        const loadingScreen = document.getElementById('loadingScreen');
        if (loadingScreen) {
          setTimeout(() => {
            loadingScreen.classList.add('hidden');
          }, 300);
        }
      });
    </script>
  </body>
</html>
